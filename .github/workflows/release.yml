name: release

# Every push to main tests, builds and publishes a release. reDraw checks the newest release at launch
# and every 30 minutes, so pushing here is all it takes for installed copies to update themselves.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      # The version is 0.2.<run number>: it only ever goes up, which is what the updater compares.
      REDRAW_VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --release

      - name: Build reDraw
        run: cargo build --release

      - name: Build the installer (it carries redraw.exe inside)
        shell: pwsh
        env:
          REDRAW_EXE: ${{ github.workspace }}\target\release\redraw.exe
        run: cargo build --release --manifest-path installer/Cargo.toml

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\redraw.exe dist\redraw.exe
          Copy-Item installer\target\release\redraw-setup.exe dist\reDraw-Setup.exe
          $hash = (Get-FileHash dist\redraw.exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item dist\redraw.exe).Length
          $v = $env:REDRAW_VERSION
          # latest.txt is what installed copies read: the version, the checksum, and where the exe is.
          @(
            "version=$v",
            "sha256=$hash",
            "size=$size",
            "url=https://github.com/${{ github.repository }}/releases/download/v$v/redraw.exe"
          ) | Set-Content -Encoding ascii dist\latest.txt
          Get-Content dist\latest.txt

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:REDRAW_VERSION
          $short = $env:GITHUB_SHA.Substring(0, 7)
          gh release create "v$v" dist\redraw.exe dist\reDraw-Setup.exe dist\latest.txt `
            --target $env:GITHUB_SHA `
            --title "reDraw $v" `
            --notes "Automatic build of commit $short. Run reDraw-Setup.exe to install; installed copies update themselves." `
            --latest
