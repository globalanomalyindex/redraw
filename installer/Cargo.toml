[package]
name = "redraw-setup"
version = "0.2.0"
edition = "2021"
authors = ["Christopher Robin Fiore"]
description = "Installer for reDraw: one file, current user only, no administrator."

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
